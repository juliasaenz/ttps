<div class="container centered ">
  <h2>Comidas</h2>

  <div class="comidas-container">
    <!-- Tabla -->
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Tipo</th>
          <th>Vegetariano</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let comida of comidas">
          <td>{{ comida.nombre }}</td>
          <td>{{ comida.tipo }}</td>
          <td>{{ comida.vegetariano ? "Si" : "No" }}</td>
          <td>
            <button class="btn" (click)="editComida(comida)"> Editar </button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Form -->
    <div class="form-container">
      <h3>Agregar Comida</h3>
      <form (ngSubmit)="addComida()" #comidaForm="ngForm">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            [(ngModel)]="newComida.nombre"
            placeholder="Enter name"
            required
          />
        </div>

        <div class="form-group">
          <label for="tipo">Tipo</label>
          <select id="tipo" name="tipo" [(ngModel)]="newComida.tipo" required>
            <option value="" disabled selected>Elegir tipo</option>
            <option value="ENTRADA">Entrada</option>
            <option value="PLATO_PRINCIPAL">Plato Principal</option>
            <option value="BEBIDA">Bebida</option>
            <option value="POSTRE">Postre</option>
          </select>
        </div>

        <div class="form-group">
          <label>
           
            Vegetariana
            <input
            type="checkbox"
            name="vegetariano"
            [(ngModel)]="newComida.vegetariano"
            style="width: 40px;"
          />
          </label>
        </div>

        <button type="submit" class="btn" [disabled]="!comidaForm.form.valid">
          Agregar Comida
        </button>
      </form>
    </div>
  </div>
</div>
