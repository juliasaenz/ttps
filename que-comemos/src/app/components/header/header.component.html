<header class="header">
    <div class="logo">
        <a routerLink="/" class="nav-link">
            <h3>¿Qué Comemos?</h3>
        </a>
    </div>
    <nav class="navbar">
        <!-- Si no está logeado -->
        <ng-container *ngIf="!isLoggedIn">
            <a routerLink="/login" routerLinkActive="active" class="nav-link">
                <i class="fas fa-sign-in-alt"></i>
                Entrar </a>

            <a routerLink="/registro" routerLinkActive="active" class="nav-link"> <i class="fas fa-user-plus"></i>
                Registro </a>
        </ng-container>

        <!-- Si está logeado -->
        <ng-container *ngIf="isLoggedIn">


            <!-- Tabs para admin/responsable -->
            <ng-container *ngIf="userRole === 'admin' || userRole === 'responsable'">
                <a routerLink="/comidas" routerLinkActive="active" class="nav-link">
                    <i class="fa-solid fa-burger"></i> Comidas</a>
                <a routerLink="/menu" routerLinkActive="active" class="nav-link">
                    <i class="fa-solid fa-utensils"></i>
                    Menús</a>
                <a routerLink="/carta" routerLinkActive="active" class="nav-link">
                    <i class="fa-regular fa-calendar"></i>
                    Carta</a>
            </ng-container>
            <a routerLink="/logout" class="nav-link"> <i class="fas fa-sign-out-alt"></i> Salir </a>
        </ng-container>
    </nav>
</header>
